name: Validate NORTHSTAR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-and-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile app
        run: python -m py_compile app.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Smoke-test imports
        run: python -c "import streamlit, yfinance, pandas, numpy, plotly, supabase; print('Dependencies OK')"
